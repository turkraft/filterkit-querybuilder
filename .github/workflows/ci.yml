name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: turkraft/filterkit
          path: .filterkit
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and link the core
        run: |
          npm --prefix .filterkit ci
          npm --prefix .filterkit run build
          rm -rf node_modules/@turkraft/filterkit
          mkdir -p node_modules/@turkraft
          ln -s "$PWD/.filterkit" node_modules/@turkraft/filterkit
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
